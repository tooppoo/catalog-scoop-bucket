name: Update enozunu Scoop manifest

on:
  workflow_dispatch:
    inputs:
      version:
        description: enozunu version to update to, for example 0.4.0 or v0.4.0
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Update enozunu manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Test manifest updater
        run: npm test

      - name: Update manifest
        id: update
        env:
          ENOZUNU_VERSION: ${{ inputs.version }}
        run: |
          npm run update:enozunu -- --version "$ENOZUNU_VERSION"

      - name: Validate generated diff
        run: |
          git diff --check
          git diff -- bucket/enozunu.json

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update enozunu Scoop manifest to ${{ steps.update.outputs.manifest_version }}
          title: Update enozunu Scoop manifest to ${{ steps.update.outputs.manifest_version }}
          body: |
            ## Summary

            Updates `bucket/enozunu.json` for enozunu `${{ steps.update.outputs.release_tag }}`.

            The manifest update was generated from the release `checksums.txt` file. The workflow does not download release archives.

            ## Updated fields

            - `version`
            - `architecture.64bit.url`
            - `architecture.64bit.hash`
          branch: update/enozunu-${{ steps.update.outputs.manifest_version }}
          delete-branch: true
          add-paths: |
            bucket/enozunu.json
